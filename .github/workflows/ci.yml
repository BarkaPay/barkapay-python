name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; nothing here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      # --locked: the exact, hash-checked tool versions of uv.lock.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatting (ruff format)
        run: uv run ruff format --check .

      - name: Static analysis (mypy, strict)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

  package:
    name: Build & check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'

      # Same commands as the release workflow, so a release build is proven
      # on every pull request.
      - name: Build sdist + wheel
        run: uv build

      - name: Check the distribution (version, contents, metadata)
        run: python3 .github/scripts/check_dist.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Check the long description renders on PyPI
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

  install:
    name: Install the built wheel
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.9'
          enable-cache: false

      # No checkout: this imports the wheel exactly as a user gets it.
      - name: Import the installed package
        run: |
          uv venv .venv-smoke
          uv pip install --python .venv-smoke dist/*.whl
          .venv-smoke/bin/python - <<'PY'
          import importlib.metadata as metadata
          import importlib.resources as resources

          import payhub

          assert metadata.version("barkapay-payhub") == payhub.__version__, payhub.__version__
          runtime = [r for r in (metadata.requires("barkapay-payhub") or []) if "extra ==" not in r]
          assert runtime == [], f"runtime dependencies crept in: {runtime}"
          assert resources.files("payhub").joinpath("py.typed").is_file(), "py.typed missing"
          client = payhub.PayHub(api_key="key_id:secret", country="bf")
          assert hasattr(client, "payment_links")
          print("barkapay-payhub", payhub.__version__, "OK")
          PY
