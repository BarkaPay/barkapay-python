name: Release

# Publishes to PyPI when a version tag (vX.Y.Z) is pushed.
#
# Auth: PyPI Trusted Publishing (OIDC) — no token is stored anywhere. The PyPI
# project "barkapay" trusts this exact workflow file (release.yml) in
# BarkaPay/barkapay-python running in the `pypi` environment. Renaming the file,
# the repository or the environment breaks publishing until PyPI is updated.
#
# First release of the "barkapay" project (2.0.0): the project does not exist
# yet, so register a *pending* publisher before pushing the tag —
#   pypi.org → Your account → Publishing → "Add a new pending publisher" →
#   GitHub: PyPI project name `barkapay`, owner `BarkaPay`, repository
#   `barkapay-python`, workflow `release.yml`, environment `pypi`.
# The first successful publish turns it into the project's trusted publisher.
# The repository must already be named `barkapay-python` when the tag is pushed
# (the OIDC token carries the repository name).
#
# Cut a release: bump src/barkapay/_version.py, update CHANGELOG.md, merge to
# main, then
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Dry run: start this workflow manually ("Run workflow"). It tests and builds
# exactly like a release, and never publishes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; only the publish job gets more (id-token).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  build:
    name: Build the distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A tag pushed on a side branch (or on an unreviewed commit) never publishes.
      - name: Tag must point at a commit of main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to publish."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Read the package version
        id: version
        run: |
          pkg="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*' src/barkapay/_version.py | head -1)"
          if [ -z "$pkg" ]; then
            echo "::error::Could not read the version from src/barkapay/_version.py"
            exit 1
          fi
          echo "value=$pkg" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          PKG_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$tag does not match _version.py $PKG_VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Check the distribution (version, contents, metadata)
        env:
          PKG_VERSION: ${{ steps.version.outputs.value }}
        run: python3 .github/scripts/check_dist.py dist "$PKG_VERSION"

      # Uploaded before any third-party checker runs: what gets published is
      # exactly what the build produced. A failing check below still fails
      # this job, so nothing is published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Check the long description renders on PyPI
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: build
    # Only a pushed version tag publishes — never a manual (dry) run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/barkapay/
    permissions:
      id-token: write # OIDC trusted publishing — the only permission of this job
    steps:
      # No checkout and no build tool here: the job that can publish runs
      # nothing but the artifact download and the PyPA publisher.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
